<svg xmlns="http://www.w3.org/2000/svg" width="900" height="80" viewBox="0 0 900 80">
  <!-- Background -->
  <rect width="900" height="80" fill="#ddf0dd" />

  <!-- Decorative side bar -->
  <rect x="0" y="0" width="6" height="80" fill="#2d6a4f" opacity="0.8" />
  <rect x="894" y="0" width="6" height="80" fill="#2d6a4f" opacity="0.8" />

  <!-- Leaf / nature motif (simple) -->
  <ellipse cx="60" cy="40" rx="28" ry="14" fill="#40916c" opacity="0.18" transform="rotate(-20 60 40)" />
  <ellipse cx="60" cy="40" rx="18" ry="8" fill="#2d6a4f" opacity="0.13" transform="rotate(10 60 40)" />
  <line x1="60" y1="28" x2="60" y2="54" stroke="#2d6a4f" stroke-width="1.2" opacity="0.3" />

  <!-- Mirror motif on the right -->
  <ellipse cx="840" cy="40" rx="28" ry="14" fill="#40916c" opacity="0.18" transform="rotate(20 840 40)" />
  <ellipse cx="840" cy="40" rx="18" ry="8" fill="#2d6a4f" opacity="0.13" transform="rotate(-10 840 40)" />
  <line x1="840" y1="28" x2="840" y2="54" stroke="#2d6a4f" stroke-width="1.2" opacity="0.3" />

  <!-- Main title -->
  <text
    x="450"
    y="36"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="26"
    font-weight="700"
    fill="#1b4332"
    letter-spacing="1"
  >מתחת לסלע</text>

  <!-- Subtitle -->
  <text
    x="450"
    y="60"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="14"
    font-weight="400"
    fill="#2d6a4f"
    letter-spacing="0.5"
  >רקפת משתפת</text>

  <!-- Thin separator line under title -->
  <line x1="330" y1="43" x2="570" y2="43" stroke="#40916c" stroke-width="0.8" opacity="0.5" />
</svg>
